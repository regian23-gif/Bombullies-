name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Create Firebase Configuration
        run: |
          # Create firebase-config.json from GitHub Secrets if available
          if [ -n "${{ secrets.FIREBASE_API_KEY }}" ]; then
            cat > firebase-config.json << EOF
          {
            "apiKey": "${{ secrets.FIREBASE_API_KEY }}",
            "authDomain": "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            "projectId": "${{ secrets.FIREBASE_PROJECT_ID }}",
            "storageBucket": "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            "messagingSenderId": "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
            "appId": "${{ secrets.FIREBASE_APP_ID }}",
            "measurementId": "${{ secrets.FIREBASE_MEASUREMENT_ID }}"
          }
          EOF
            echo "✅ Firebase configuration file created"
          else
            echo "⚠️ Firebase secrets not configured, skipping Firebase configuration"
          fi
      
      - name: Run Lint
        run: ./gradlew lintDebug
        continue-on-error: true
      
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
        continue-on-error: true
      
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      
      - name: Build Debug App Bundle
        run: ./gradlew bundleDebug
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
      
      - name: Upload Debug App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: debug-bundle
          path: app/build/outputs/bundle/debug/*.aab
          retention-days: 7
      
      - name: Upload Lint Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: app/build/reports/lint-results-*.html
          retention-days: 7
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 7

  build-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Create Firebase Configuration
        run: |
          # Create firebase-config.json from GitHub Secrets
          cat > firebase-config.json << EOF
          {
            "apiKey": "${{ secrets.FIREBASE_API_KEY }}",
            "authDomain": "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            "projectId": "${{ secrets.FIREBASE_PROJECT_ID }}",
            "storageBucket": "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            "messagingSenderId": "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
            "appId": "${{ secrets.FIREBASE_APP_ID }}",
            "measurementId": "${{ secrets.FIREBASE_MEASUREMENT_ID }}"
          }
          EOF
          echo "✅ Firebase configuration file created"
      
      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          echo "✅ Keystore decoded"
      
      - name: Build Release App Bundle
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=../keystore.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      
      - name: Upload Release App Bundle
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        with:
          name: release-bundle
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
      
      - name: Build Unsigned Release (if no keystore)
        if: env.KEYSTORE_BASE64 == ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "⚠️ No keystore configured. Building unsigned release bundle."
          echo "To build signed releases, add these secrets to your repository:"
          echo "  - KEYSTORE_BASE64: Base64-encoded keystore file"
          echo "  - KEYSTORE_PASSWORD: Keystore password"
          echo "  - KEY_ALIAS: Key alias"
          echo "  - KEY_PASSWORD: Key password"
          ./gradlew bundleRelease
      
      - name: Upload Unsigned Release App Bundle
        if: env.KEYSTORE_BASE64 == ''
        uses: actions/upload-artifact@v4
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        with:
          name: unsigned-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
